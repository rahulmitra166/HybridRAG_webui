              function drawGraph() {

                  // parsing and collecting nodes and edges from the python
                  nodes = new vis.DataSet([{"group": "Document", "id": "Paper:regolith", "label": "Statistical Analysis and Modeling of the 3D Morphology and T", "shape": "dot", "title": "Document: Statistical Analysis and Modeling of the 3D Morphology and Texture of Lunar Regolith Simulants\u003cbr\u003eThe paper uses 3D X-ray micro-CT data and multivariate statistical/parametric modeling to quantify size and shape descriptor distributions for lunar regolith particles and seven mare/highlands simulants, finding large morphological differences among simulants and versus lunar regolith and motivating improved simulants or statistically representative digital models for simulation-based studies of morphology-driven mechanical behavior relevant to ISRU. (regolith.pdf p.1, p.2)\u003cbr\u003eregolith.pdf"}, {"group": "Chunk", "id": "Chunk:chunk_3b9026e63363ad14", "label": "chunk_3b9026e63363ad14", "shape": "dot", "title": "Chunk: chunk_3b9026e63363ad14\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Document", "id": "Document:regolith_p7_chunk_3b9026e63363ad14", "label": "regolith_p7_chunk_3b9026e63363ad14", "shape": "dot", "title": "Document: regolith_p7_chunk_3b9026e63363ad14\u003cbr\u003ePDF page text chunk discussing R-vine copulas, dataset construction from segmented particles, and limitations of univariate analysis for regolith simulants.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Dataset", "id": "Dataset:segmented_particles_data", "label": "segmented_particles_data", "shape": "dot", "title": "Dataset: segmented_particles_data\u003cbr\u003eData containing all segmented particles used to compute particle descriptors for subsequent analysis.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Descriptor", "id": "Descriptor:particle_descriptors", "label": "particle_descriptors", "shape": "dot", "title": "Descriptor: particle_descriptors\u003cbr\u003eComputed descriptors of particles used to construct the analysis dataset. | Descriptors of particle shape and texture used for analysis and modeling.\u003cbr\u003eregolith.pdf p.10 page_text chunk_2ca960600a9df8b8 || regolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Material", "id": "Material:regolith_simulants", "label": "regolith_simulants", "shape": "dot", "title": "Material: regolith_simulants\u003cbr\u003eRegolith simulants whose similarities and differences are analyzed statistically. | Regolith simulants that may differ in fines content, composition, and descriptor distributions. | Regolith simulants developed and assessed as potential representatives of lunar regolith. | Seven different regolith simulants from which particle image data were considered. | Terrestrial substitute materials used in experiments to approximate lunar regolith. | Considered regolith simulants compared via descriptors of shape and texture. | Regolith simulants contrasted with lunar regolith, with large reported differences. | Regolith simulants whose exemplary particles were measured via X-ray tomography.\u003cbr\u003eregolith.pdf p.10 page_text chunk_2ca960600a9df8b8 || regolith.pdf p.13 page_text chunk_384212dd00619739 || regolith.pdf p.13 page_text chunk_e99dbc4d11e11bdf || regolith.pdf p.2 page_text chunk_44889c813b9be835 || regolith.pdf p.3 page_text chunk_99780812c420d780 || regolith.pdf p.7 page_text chunk_3b9026e63363ad14 || regolith.pdf p.7 page_text chunk_5647a24ba128bfa1 || regolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Method", "id": "Method:statistical_analysis_similarities", "label": "statistical_analysis_similarities", "shape": "dot", "title": "Method: statistical_analysis_similarities\u003cbr\u003eStatistical analysis of similarities and differences of regolith simulants based on the computed dataset.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Concept", "id": "Concept:r_vine_copulas", "label": "r_vine_copulas", "shape": "dot", "title": "Concept: r_vine_copulas\u003cbr\u003eA copula-based approach for parametrically modeling multivariate distributions in arbitrary dimensions with flexible correlation structure.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Method", "id": "Method:pair_copula_approach", "label": "pair_copula_approach", "shape": "dot", "title": "Method: pair_copula_approach\u003cbr\u003eThe approach underlying R-vine copulas, outlined for the case d=3. | An approach that can be iteratively applied to represent multivariate densities using lower-dimensional components.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14 || regolith.pdf p.7 page_text chunk_5647a24ba128bfa1"}, {"group": "Variable", "id": "Variable:random_vector_x", "label": "random_vector_X", "shape": "dot", "title": "Variable: random_vector_X\u003cbr\u003eThree-dimensional random vector X=(X1,X2,X3) with joint probability density and marginals. | Three-dimensional random vector X=(X1,X2,X3) for which a joint probability density f:R3\u2192[0,\u221e) is computed.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14 || regolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Variable", "id": "Variable:joint_density_f", "label": "joint_density_f", "shape": "dot", "title": "Variable: joint_density_f\u003cbr\u003eJoint probability density f of the random vector X on R^3.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Variable", "id": "Variable:marginal_densities_f1_f2_f3", "label": "marginal_densities_f1_f2_f3", "shape": "dot", "title": "Variable: marginal_densities_f1_f2_f3\u003cbr\u003eMarginal densities f1,f2,f3 of X1,X2,X3 on R.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Variable", "id": "Variable:cdfs_f1_f2_f3", "label": "cdfs_F1_F2_F3", "shape": "dot", "title": "Variable: cdfs_F1_F2_F3\u003cbr\u003eUnivariate cumulative distribution functions F1,F2,F3 corresponding to X1,X2,X3.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Variable", "id": "Variable:copula_densities_c12_c23", "label": "copula_densities_c12_c23", "shape": "dot", "title": "Variable: copula_densities_c12_c23\u003cbr\u003eCopula densities c1,2 and c2,3 corresponding to the distributions of (X1,X2) and (X2,X3).\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Variable", "id": "Variable:conditional_copula_density_c13_given_x2", "label": "conditional_copula_density_c13_given_x2", "shape": "dot", "title": "Variable: conditional_copula_density_c13_given_x2\u003cbr\u003eCopula density c1,3|X2=x2 corresponding to the conditional distribution of (X1,X3) given X2.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Equation", "id": "Equation:equation_8", "label": "equation_8", "shape": "dot", "title": "Equation: equation_8\u003cbr\u003eFactorization of f(x1,x2,x3) using conditional and pair copula densities and marginal densities. | Referenced equation giving a representation formula related to the pair-copula approach.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14 || regolith.pdf p.7 page_text chunk_5647a24ba128bfa1"}, {"group": "Method", "id": "Method:univariate_data_analysis", "label": "univariate_data_analysis", "shape": "dot", "title": "Method: univariate_data_analysis\u003cbr\u003eUnivariate data analysis performed with stated limitations due to sample preparation and density weighting choices.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Method", "id": "Method:sample_preparation_sieving", "label": "sample_preparation_sieving", "shape": "dot", "title": "Method: sample_preparation_sieving\u003cbr\u003eSample preparation procedure removing fines below 25\u03bcm and extremely large particles above 250\u03bcm by sieving.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Variable", "id": "Variable:particle_size", "label": "particle_size", "shape": "dot", "title": "Variable: particle_size\u003cbr\u003eParticle size variable analyzed via histograms and constrained by sample preparation to a specified measured fraction. | Particle size noted as influencing mechanical properties of regolith materials. | Particle size measured/assessed for regolith simulant samples.\u003cbr\u003eregolith.pdf p.13 page_text chunk_e99dbc4d11e11bdf || regolith.pdf p.2 page_text chunk_44889c813b9be835 || regolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Limitation", "id": "Limitation:measured_fraction_25_250", "label": "measured_fraction_25_250", "shape": "dot", "title": "Limitation: measured_fraction_25_250\u003cbr\u003eValidity limitation stating analysis applies only to measured particle sizes between 25\u03bcm and 250\u03bcm, with possible small out-of-range presence.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Limitation", "id": "Limitation:sieving_inaccuracy", "label": "sieving_inaccuracy", "shape": "dot", "title": "Limitation: sieving_inaccuracy\u003cbr\u003eUnavoidable inaccuracy of the sieving process leading to some particles outside the intended size range.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Finding", "id": "Finding:bulk_properties_change", "label": "bulk_properties_change", "shape": "dot", "title": "Finding: bulk_properties_change\u003cbr\u003eRemoving fines and very large particles may change bulk properties compared to manufacturer specifications.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Limitation", "id": "Limitation:non_volume_weighted_densities", "label": "non_volume_weighted_densities", "shape": "dot", "title": "Limitation: non_volume_weighted_densities\u003cbr\u003eProbability densities used are not volume-weighted and may not reflect the visual impression from an image figure.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Instrument", "id": "Instrument:laser_diffraction", "label": "laser_diffraction", "shape": "dot", "title": "Instrument: laser_diffraction\u003cbr\u003eLaser diffraction instrument used to obtain particle size histograms.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Dataset", "id": "Dataset:particle_size_histograms", "label": "particle_size_histograms", "shape": "dot", "title": "Dataset: particle_size_histograms\u003cbr\u003eHistograms of particle sizes obtained by laser diffraction for comparison.\u003cbr\u003eregolith.pdf p.7 page_text chunk_3b9026e63363ad14"}, {"group": "Chunk", "id": "Chunk:chunk_73c87c0131a065ed", "label": "chunk_73c87c0131a065ed", "shape": "dot", "title": "Chunk: chunk_73c87c0131a065ed\u003cbr\u003eregolith.pdf p.7 page_text chunk_73c87c0131a065ed\u003cbr\u003eregolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Document", "id": "Document:doc_p7_chunk73c87c", "label": "doc_p7_chunk73c87c", "shape": "dot", "title": "Document: doc_p7_chunk73c87c\u003cbr\u003ePDF chunk describing comparisons of particle-size histograms from laser diffraction and CT image data and copula-based conditional/joint distribution formulas for variables X1, X2, X3.\u003cbr\u003eregolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Concept", "id": "Concept:particle_size_histograms_fig4", "label": "particle_size_histograms_fig4", "shape": "dot", "title": "Concept: particle_size_histograms_fig4\u003cbr\u003eHistograms of particle sizes shown in Figure 4, including conditional distributions and CT-derived sizes.\u003cbr\u003eregolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Method", "id": "Method:laser_diffraction", "label": "laser_diffraction", "shape": "dot", "title": "Method: laser_diffraction\u003cbr\u003eParticle-size measurement technique based on laser diffraction used to obtain conditional distributions/histograms. | Laser diffraction method used to determine particle size distribution after sieving.\u003cbr\u003eregolith.pdf p.3 page_text chunk_99780812c420d780 || regolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Method", "id": "Method:ct_imaging", "label": "ct_imaging", "shape": "dot", "title": "Method: ct_imaging\u003cbr\u003eCT imaging technique whose image data are used to compute particle sizes for histograms. | Computed tomography imaging used to study regolith particle morphology and texture.\u003cbr\u003eregolith.pdf p.13 page_text chunk_e99dbc4d11e11bdf || regolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Dataset", "id": "Dataset:laser_diffraction_data", "label": "laser_diffraction_data", "shape": "dot", "title": "Dataset: laser_diffraction_data\u003cbr\u003eParticle-size data obtained by laser diffraction and used for conditional distributions/histograms.\u003cbr\u003eregolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Dataset", "id": "Dataset:ct_image_data", "label": "ct_image_data", "shape": "dot", "title": "Dataset: ct_image_data\u003cbr\u003eCT image data used to compute particle sizes for histogram comparison.\u003cbr\u003eregolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Limitation", "id": "Limitation:measurement_technique_diff_limitation", "label": "measurement_technique_diff_limitation", "shape": "dot", "title": "Limitation: measurement_technique_diff_limitation\u003cbr\u003eComparisons between laser diffraction results and CT image data are affected by differences between measurement techniques.\u003cbr\u003eregolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Material", "id": "Material:fines", "label": "fines", "shape": "dot", "title": "Material: fines\u003cbr\u003eFine particles that may be present in laser diffraction data but not in CT-imaged samples.\u003cbr\u003eregolith.pdf p.7 page_text chunk_73c87c0131a065ed"}, {"group": "Limitation", "id": "Limitation:sample_vs_bulk_limitation", "label": "sample_vs_bulk_limitation", "shape": "dot", "title": "Limit
